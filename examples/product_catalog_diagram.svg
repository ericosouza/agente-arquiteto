            </g>
        </g>
        

        <g id="relation-INT-BE-DB">
            <!-- Line Path -->
            <path d="M 635.0 540 C 635.0 645.0, 500.0 645.0, 500.0 750" fill="none" stroke="#0284C7" stroke-width="1.6"
                  stroke-dasharray="5,4" marker-end="url(#marker-access)" opacity="0.85" />

            <!-- Edge Label Pill -->
            <g transform="translate(551.5, 635.0)">
