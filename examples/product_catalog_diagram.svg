<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1070" width="100%" height="100%" style="background-color: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

        <defs>
            <!-- Background Grid -->
            <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.6"/>
            </pattern>

            <!-- Drop Shadow Filter -->
            <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
            </filter>

            <!-- ArchiMate Relationship Markers -->
            <!-- Serving: Open Arrow -->
            <marker id="marker-serving" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </marker>

            <!-- Access: Open Arrow with dashed line convention -->
            <marker id="marker-access" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </marker>

            <!-- Realization: Hollow Triangular Arrowhead -->
            <marker id="marker-realization" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
                <path d="M 0 1 L 11 6 L 0 11 Z" fill="#FFFFFF" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" />
            </marker>

            <!-- Assignment: Filled Circle -->
            <marker id="marker-assignment" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <circle cx="5" cy="5" r="4" fill="#334155" />
            </marker>

            <!-- Flow: Solid Filled Arrow -->
            <marker id="marker-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 9 5 L 0 9 Z" fill="#334155" />
            </marker>

            <!-- Association: Standard simple line (no arrowhead) -->
        </defs>
        
<rect width="1000" height="1070" fill="url(#grid)" />

        <g id="diagram-header" transform="translate(50, 35)">
            <text x="0" y="0" font-size="20" font-weight="700" fill="#0F172A">Arquitetura de Software: Sistema de Produtos</text>
            <text x="0" y="20" font-size="12" fill="#64748B">Notação Oficial ArchiMate 3.2 • Gerado por AI Software Architecture Designer</text>
        </g>
        

            <g id="layer-band-Business_Layer">
                <!-- Layer Container Box -->
                <rect x="50" y="90" width="900" height="190"
                      rx="12" ry="12" fill="#FFF9C4" fill-opacity="0.25"
                      stroke="#FBC02D" stroke-width="1.5" stroke-dasharray="6,4" />
                <!-- Layer Banner / Title Tab -->
                <rect x="66" y="76" width="156" height="26"
                      rx="6" ry="6" fill="#FBC02D" />
                <text x="76" y="94" font-size="12" font-weight="700" fill="#FFFFFF">Business Layer</text>
            </g>
            

            <g id="layer-band-Application_Layer">
                <!-- Layer Container Box -->
                <rect x="50" y="400" width="900" height="190"
                      rx="12" ry="12" fill="#E1F5FE" fill-opacity="0.25"
                      stroke="#0288D1" stroke-width="1.5" stroke-dasharray="6,4" />
                <!-- Layer Banner / Title Tab -->
                <rect x="66" y="386" width="183" height="26"
                      rx="6" ry="6" fill="#0288D1" />
                <text x="76" y="404" font-size="12" font-weight="700" fill="#FFFFFF">Application Layer</text>
            </g>
            

            <g id="layer-band-Technology_Layer">
                <!-- Layer Container Box -->
                <rect x="50" y="710" width="900" height="190"
                      rx="12" ry="12" fill="#E8F5E9" fill-opacity="0.25"
                      stroke="#388E3C" stroke-width="1.5" stroke-dasharray="6,4" />
                <!-- Layer Banner / Title Tab -->
                <rect x="66" y="696" width="174" height="26"
                      rx="6" ry="6" fill="#388E3C" />
                <text x="76" y="714" font-size="12" font-weight="700" fill="#FFFFFF">Technology Layer</text>
            </g>
            

        <g id="relation-REL-USER-FE">
            <!-- Line Path -->
            <path d="M 365.0 440 C 365.0 335.0, 500.0 335.0, 500.0 230" fill="none" stroke="#334155" stroke-width="1.6"
                  stroke-dasharray="none" marker-end="url(#marker-serving)" opacity="0.85" />

            <!-- Edge Label Pill -->
            <g transform="translate(395.5, 325.0)">
                <rect x="0" y="0" width="74" height="18" rx="9" ry="9"
                      fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
                <text x="37.0" y="12" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">
                    Acesso Web
                </text>
